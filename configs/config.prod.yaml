# OSS Server 生产环境配置
# 通过 OSS_ENV=prod 加载
# 部署时请配置 dsn 等敏感项；JWT 签名密钥由服务首次启动时写入数据库。

server:
  host: "0.0.0.0"
  port: 8080
  mode: "release"              # 生产环境关闭 debug
  max_multipart_memory_mb: 8
  max_file_size_mb: 100

database:
  driver: "sqlite"             # 生产亦可继续用 sqlite；如需切 PG 改成 postgres 并填 DSN
  dsn: "data/oss.db"

storage:
  data_dir: "data"
  max_total_size_mb: 0       # 整个数据目录容量上限，0 表示不限

auth:
  jwt_secret: ""
  jwt_ttl_hours: 72
  web_session_ttl_hours: 24
  device_jwt_ttl_hours: 720
  allow_anonymous_registration: true # 仅作为新数据库注册开关的初始值；之后由管理面板控制

sync:
  max_concurrency: 6
  device_stale_days: 90
  reconcile_interval_hours: 24
  temp_file_max_age_hours: 24
  orphan_file_grace_hours: 24

update:
  github_repo: "helantianshen/oss-sync" # GitHub Release 仓库（owner/repo）
  download_source: "proxy"               # 更新检查与下载源：official / proxy / custom
  download_proxy: ""                     # custom 源的 HTTPS 地址前缀
  timeout_seconds: 15                   # GitHub 请求超时
  check_limit: 6                        # 检查更新接口限流次数
  check_window_seconds: 60              # 检查更新接口限流窗口
