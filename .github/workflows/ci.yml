name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go build ./...
      - run: go vet ./...

  plugin:
    name: Plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm exec tsc -- --noEmit
      - run: npm test
      - run: npm run build

  container:
    name: Container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OSS_PORT: 18080
      OSS_VERSION: 0.0.0
      OSS_COMMIT: ci
      OSS_BUILT_AT: unknown
    steps:
      - uses: actions/checkout@v7
      - name: Verify container build inputs
        run: |
          test -f cmd/server/main.go
          test -f internal/server/server.go
          grep -F 'github.com/helantianshen/oss-sync/internal/version.Version' Dockerfile
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 120
      - run: curl --fail --silent --show-error http://127.0.0.1:18080/readyz
      - if: failure()
        run: docker compose logs backend
      - if: always()
        run: |
          docker compose down --volumes


  deployment:
    name: Binary and systemd deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: bash -n oss.sh
      - name: Real systemd smoke test
        shell: bash
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/binary-release"
          mkdir -p "$release"
          go build -ldflags '-X github.com/helantianshen/oss-sync/internal/version.Version=0.0.0' -o "$release/oss-server" ./cmd/server
          python3 scripts/package-release.py --binary "$release/oss-server" --version 0.0.0 --os linux --arch amd64 --output "$release"
          cp oss.sh "$release/"
          (cd "$release" && sha256sum oss-sync_0.0.0_linux_amd64.tar.gz oss.sh > checksums.txt)
          sudo env OSS_INSTALL_DIR=/opt/oss-sync-ci OSS_GLOBAL_BIN_DIR=/opt/oss-sync-ci-commands OSS_PORT=18081 OSS_STORAGE_LIMIT_GB=1 OSS_RELEASE_PROXY=official OSS_VERSION=0.0.0 OSS_RELEASE_BASE_URL="file://$release" bash oss.sh install
          sudo systemd-analyze verify /etc/systemd/system/oss-sync.service
          curl -fsS http://127.0.0.1:18081/readyz
          sudo /opt/oss-sync-ci/oss.sh 4 1 2
          sudo /opt/oss-sync-ci/oss.sh 4 2 18082
          curl -fsS http://127.0.0.1:18082/readyz
          sudo env OSS_RELEASE_PROXY=official OSS_VERSION=0.0.0 OSS_RELEASE_BASE_URL="file://$release" /opt/oss-sync-ci/oss.sh 1
          curl -fsS http://127.0.0.1:18082/readyz
          sudo /opt/oss-sync-ci/oss.sh 6 2 yes
          sudo test -f /opt/oss-sync-ci/data/oss.db
      - if: failure()
        run: sudo journalctl -u oss-sync --no-pager -n 100
      - if: always()
        run: |
          sudo systemctl disable --now oss-sync || true
          sudo rm -f /etc/systemd/system/oss-sync.service
          sudo systemctl daemon-reload
