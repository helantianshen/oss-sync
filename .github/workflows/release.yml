name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*-rc.*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "Release tag must match <major>.<minor>.<patch>[-rc.<number>] with optional v prefix" >&2
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python3 scripts/check-versions.py --release "$GITHUB_REF_NAME"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Backend regression tests
        run: go test -race ./...

      - name: Build server assets
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_DIR: ${{ runner.temp }}/oss-build
          DIST_DIR: ${{ runner.temp }}/oss-release
        run: |
          set -euo pipefail
          mkdir -p "$BUILD_DIR" "$DIST_DIR"
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          commit="${GITHUB_SHA::12}"
          ldflags="-s -w -X github.com/helantianshen/oss-sync/internal/version.Version=$VERSION -X github.com/helantianshen/oss-sync/internal/version.Commit=$commit -X github.com/helantianshen/oss-sync/internal/version.BuiltAt=$built_at"

          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            target_dir="$BUILD_DIR/$goos-$goarch"
            mkdir -p "$target_dir"
            binary="oss-server"
            if [[ "$goos" == "windows" ]]; then binary="oss-server.exe"; fi
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags "$ldflags" -o "$target_dir/$binary" ./cmd/server

            python3 scripts/package-release.py --binary "$target_dir/$binary" \
              --version "$VERSION" --os "$goos" --arch "$goarch" --output "$DIST_DIR"
          done

          test "$("$BUILD_DIR/linux-amd64/oss-server" --version)" = "$VERSION"

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Build plugin assets
        working-directory: plugin
        run: |
          npm ci
          npm run lint
          npm exec tsc -- --noEmit
          npm test
          npm run build

      - name: Collect plugin assets
        env:
          DIST_DIR: ${{ runner.temp }}/oss-release
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp plugin/main.js plugin/manifest.json plugin/styles.css "$DIST_DIR/"
          test -s "$DIST_DIR/main.js"
          test -s "$DIST_DIR/manifest.json"
          test -s "$DIST_DIR/styles.css"

      - name: Attest plugin assets
        uses: actions/attest@v4
        with:
          subject-path: |
            ${{ runner.temp }}/oss-release/main.js
            ${{ runner.temp }}/oss-release/manifest.json
            ${{ runner.temp }}/oss-release/styles.css

      - name: Prepare container metadata
        id: image
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/oss-sync-server"
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          commit="${GITHUB_SHA::12}"
          {
            echo "image=$image"
            echo "built_at=$built_at"
            echo "commit=$commit"
            echo "tags<<EOF"
            echo "$image:$VERSION"
            if [[ "$PRERELEASE" == "false" ]]; then echo "$image:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish server image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ steps.image.outputs.commit }}
            BUILT_AT=${{ steps.image.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate release checksums
        shell: bash
        env:
          DIST_DIR: ${{ runner.temp }}/oss-release
        run: |
          set -euo pipefail
          cp oss.sh "$DIST_DIR/"
          cd "$DIST_DIR"
          sha256sum * > checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          DIST_DIR: ${{ runner.temp }}/oss-release
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "$DIST_DIR"/* "${args[@]}"
